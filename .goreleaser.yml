release:
  draft: false
  prerelease: false
  name_template: '{{ .ProjectName }} {{ .Version }}'
  footer: |
    ## Installation

    ### Using Homebrew
    ```bash
    brew install lechuckroh/tap/tmplx
    ```

    ### Manual Installation
    Download the appropriate binary for your platform from the assets above.

    ### Docker
    ```bash
    docker pull ghcr.io/lechuckroh/go-tmplx:latest
    ``` 